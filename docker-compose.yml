x-app: &app
  build: .
  volumes:
    - .:/var/www/html
    - vendor:/var/www/html/vendor
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: aidocs
    DB_USERNAME: aidocs
    DB_PASSWORD: secret
    GOTENBERG_URL: http://gotenberg:3000
    PHP_CLI_SERVER_WORKERS: 4
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    command: sh -c "composer install --no-interaction && cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - "8000:8000"

  queue:
    <<: *app
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan queue:listen --tries=1 --timeout=0"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aidocs
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidocs -d aidocs"]
      interval: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3002:3000"

volumes:
  pgdata:
  vendor:
