<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rapi Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: narrow ledger column; phase header with progress, then ruled task rows. Red only for progress and focus. */
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --fg: #18181b;
  --muted: #71717a;
  --line: #e4e4e7;
  --accent: #dc2626;
  --accent-soft: #fee2e2;
  --done: #a1a1aa;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --surface: #18181b; --fg: #f4f4f5; --muted: #a1a1aa;
    --line: #27272a; --accent: #ef4444; --accent-soft: #3f1d1d; --done: #71717a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --surface: #18181b; --fg: #f4f4f5; --muted: #a1a1aa;
  --line: #27272a; --accent: #ef4444; --accent-soft: #3f1d1d; --done: #71717a;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 28px 64px; }
main { max-width: 760px; margin-inline: auto; }
h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 20px; }
.total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.total strong { font-family: var(--font-mono); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.total span { color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
.filters { display: flex; gap: 8px; margin: 20px 0 8px; flex-wrap: wrap; }
.filters button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.phase { margin-top: 28px; }
.phase header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--fg); }
.phase h2 { font-size: 1rem; font-weight: 600; margin: 0; min-width: 0; }
.phase .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.phase .bar { margin-top: 8px; height: 3px; }
ul { list-style: none; margin: 0; padding: 0; }
li { border-bottom: 1px solid var(--line); }
label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px; cursor: pointer; }
input[type=checkbox] { appearance: none; flex: none; width: 18px; height: 18px; margin-top: 3px; border: 1.5px solid var(--muted); border-radius: 4px; background: var(--surface); cursor: pointer; display: grid; place-content: center; }
input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
input[type=checkbox]:checked::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: translateY(-1px) rotate(-45deg); }
input[type=checkbox]:disabled { cursor: default; opacity: .6; }
.num { font-family: var(--font-mono); font-size: 13px; color: var(--muted); flex: none; width: 3.2em; padding-top: 2px; }
.txt { min-width: 0; overflow-wrap: anywhere; }
.note { display: block; color: var(--muted); font-size: 13px; }
li.done .txt > span:first-child { color: var(--done); text-decoration: line-through; }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 28px 20px; color: var(--muted); text-align: center; margin-top: 24px; }
.status { color: var(--muted); font-size: 13px; margin-top: 24px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<main>
  <h1>Rapi Task Tracker</h1>
  <p class="sub">Salinan statis dari tracker artifact, untuk dibuka tanpa login. Diperbarui manual oleh Claude saat task berubah; sumber utama tetap artifact.</p>
  <div class="total"><strong id="pct">0%</strong><span id="totalTxt">memuat…</span></div>
  <div class="bar" role="progressbar" aria-label="Progres total" aria-valuemin="0" aria-valuemax="100"><i id="totalBar"></i></div>
  <div class="filters" role="group" aria-label="Filter">
    <button type="button" data-f="all" aria-pressed="true">Semua</button>
    <button type="button" data-f="open" aria-pressed="false">Belum selesai</button>
    <button type="button" data-f="done" aria-pressed="false">Selesai</button>
  </div>
  <div id="phases"></div>
  
  
</main>
<script>
const TASKS = [{"order":1,"phase":0,"num":"0.1","title":"Builder PHPWord: cover, front matter romawi, Bab/subbab bernomor, daftar pustaka","note":null,"done":true},{"order":2,"phase":0,"num":"0.2","title":"Konversi PDF via Gotenberg dengan daftar isi terisi","note":null,"done":true},{"order":3,"phase":0,"num":"0.3","title":"Verifikasi laravel/ai mendukung OpenRouter","note":null,"done":true},{"order":4,"phase":0,"num":"0.4","title":"Buka contoh-makalah.docx di MS Word: cek daftar isi, nomor halaman, hanging indent","note":null,"done":false},{"order":5,"phase":1,"num":"1.1","title":"Starter kit Laravel 13 + Livewire, Postgres, queue database, Docker Compose; cek Flux free (Table/Toast/Callout)","note":"Docker jalan, Flux free terverifikasi, APP_NAME = Rapi.","done":true},{"order":6,"phase":1,"num":"1.1b","title":"Token desain: aksen merah #DC2626, light + dark mode, layout sidebar sesuai Stitch","note":"Belum dicek visual: dark mobile, register light, settings/security. Auth/settings masih berbahasa Inggris.","done":true},{"order":7,"phase":1,"num":"1.2","title":"JSON Schema dokumen v1 + SchemaValidator + contract test","note":null,"done":true},{"order":8,"phase":1,"num":"1.3","title":"Migration documents, document_jobs; model + cast jsonb + policy pemilik","note":null,"done":true},{"order":9,"phase":1,"num":"1.4","title":"DocxBuilder dari spike: 9 solusi temuan spike + preset template default","note":"Test struktur XML lulus. Belum dibuka di MS Word asli (task 0.4).","done":true},{"order":10,"phase":1,"num":"1.5","title":"Golden test builder (fixture, DOCX, PDF, assert halaman)","note":"Golden test lewat Gotenberg + pdftotext, 7 halaman tanpa halaman kosong.","done":true},{"order":11,"phase":1,"num":"1.6","title":"TextNormalizer + unit test","note":null,"done":true},{"order":12,"phase":1,"num":"1.7","title":"Structurer (laravel/ai + OpenRouter, labeling ber-ID, chunking) + test fake provider + test integritas teks","note":"Belum ada kode Structurer dan laravel/ai belum terpasang. Centang dibatalkan karena belum dikerjakan.","done":false},{"order":13,"phase":1,"num":"1.8","title":"ImportParser untuk .md dan .txt","note":"Belum disambung ke form upload; docx rusak perlu pesan error Indonesia saat disambung.","done":true},{"order":14,"phase":1,"num":"1.9","title":"ImportParser untuk .docx (heading style jadi struktur; tanpa heading lewat Structurer)","note":"Tabel dan gambar docx diabaikan (task 3.5). Tanpa heading jatuh ke paragraf p1..pn untuk Structurer.","done":true},{"order":15,"phase":1,"num":"1.10","title":"OutlineGenerator + halaman setujui/edit outline (Livewire)","note":null,"done":false},{"order":16,"phase":1,"num":"1.10b","title":"Form Tulis topik (A2) + field data pokok per jenis dokumen (A5) + validasi","note":null,"done":false},{"order":17,"phase":1,"num":"1.11","title":"ChapterWriter job per bab + progres wire:poll + regenerate bab + aturan referensi (B4)","note":null,"done":false},{"order":18,"phase":1,"num":"1.12","title":"Halaman buat dokumen sesuai desain Dokumen baru","note":"Membuat draf Document tanpa AI. Menu aksi baris dashboard belum terhubung.","done":true},{"order":19,"phase":1,"num":"1.13","title":"Tombol export DOCX (signed URL)","note":"Unduh DOCX di dashboard via signed URL 10 menit; 115 tes lolos. Unduh PDF belum.","done":true},{"order":20,"phase":1,"num":"1.14","title":"Kumpulkan set uji 10 teks + 5 prompt, evaluasi, pilih model per tugas","note":null,"done":false},{"order":21,"phase":2,"num":"2.1","title":"Guest user otomatis + konversi ke akun saat register","note":null,"done":false},{"order":22,"phase":2,"num":"2.2","title":"Daftar dokumen: buka, duplikat, hapus","note":"Buka = halaman read-only (editor di 2.3). Unduh PDF di menu belum berfungsi (2.7).","done":true},{"order":23,"phase":2,"num":"2.3","title":"Editor blok TipTap (Alpine, wire:ignore) + auto-save debounce","note":null,"done":false},{"order":24,"phase":2,"num":"2.4","title":"Drag-and-drop bab/subbab (SortableJS) + penomoran ulang","note":null,"done":false},{"order":25,"phase":2,"num":"2.5","title":"Undo/redo di browser (minimal 50 langkah)","note":null,"done":false},{"order":26,"phase":2,"num":"2.6","title":"Preview A4 paged.js","note":null,"done":false},{"order":27,"phase":2,"num":"2.7","title":"Export PDF + tombol Preview akurat","note":null,"done":false},{"order":28,"phase":2,"num":"2.8","title":"Rate limit + kuota generate per user","note":"Catatan analisis: pasang sebelum fitur AI dibuka (task 1.7 dan seterusnya).","done":false},{"order":29,"phase":2,"num":"2.9","title":"Deploy demo: Cloudflare Tunnel, lalu Oracle Cloud Free","note":null,"done":false},{"order":30,"phase":3,"num":"3.1","title":"Format sitasi APA/IEEE/Harvard untuk daftar pustaka","note":null,"done":false},{"order":31,"phase":3,"num":"3.2","title":"Cari referensi asli (Crossref/OpenAlex), user pilih, AI menulis dengan sitasi terpilih","note":null,"done":false},{"order":32,"phase":3,"num":"3.3","title":"Peringatan sitasi tanpa entri daftar pustaka","note":null,"done":false},{"order":33,"phase":3,"num":"3.4","title":"Template custom per kampus + upload logo cover","note":null,"done":false},{"order":34,"phase":3,"num":"3.5","title":"Blok tabel dan gambar + caption bernomor + daftar tabel/gambar","note":null,"done":false},{"order":35,"phase":3,"num":"3.6","title":"Halaman pengesahan, abstrak, lampiran","note":null,"done":false},{"order":36,"phase":4,"num":"4.1","title":"MCP server (laravel/mcp): list_templates, create_document, get_document, update_chapter, export_document; auth Sanctum lalu Passport","note":null,"done":false},{"order":37,"phase":4,"num":"4.2","title":"Paket Free/Pro (kuota dokumen/halaman, template custom dan PDF untuk Pro)","note":null,"done":false},{"order":38,"phase":4,"num":"4.3a","title":"Integrasi Midtrans Snap di sandbox: order Pro sekali bayar, popup Snap, tabel payments","note":null,"done":false},{"order":39,"phase":4,"num":"4.3b","title":"Webhook Midtrans: verifikasi signature_key, cek ulang status ke API, idempotent per order_id, pro_until + 30 hari","note":null,"done":false},{"order":40,"phase":4,"num":"4.3c","title":"Feature test webhook (signature salah, notifikasi ganda, expire/cancel) + uji simulator sandbox","note":null,"done":false},{"order":41,"phase":4,"num":"4.3d","title":"Pindah ke production Midtrans (setelah 4.3a-c lolos)","note":null,"done":false},{"order":42,"phase":4,"num":"4.4","title":"Fitur AI tambahan (PUEBI, parafrase, ringkas/perpanjang, terjemahan)","note":null,"done":false},{"order":43,"phase":4,"num":"4.5","title":"Kolaborasi dan riwayat versi (evaluasi ulang batas Livewire)","note":null,"done":false}];
const PHASES = {0:"Fase 0 · Spike",1:"Fase 1 · Inti: input, AI, template, DOCX",2:"Fase 2 · Editor, PDF, akun",3:"Fase 3 · Referensi, template, elemen",4:"Fase 4 · Distribusi dan monetisasi"};
let filter = "all";
const $ = (id) => document.getElementById(id);
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function render() {
  const total = TASKS.length, done = TASKS.filter(t => t.done).length;
  const pct = Math.round(done / total * 100);
  $("pct").textContent = pct + "%";
  $("totalTxt").textContent = `${done} dari ${total} task selesai`;
  $("totalBar").style.width = pct + "%";
  document.querySelector(".total + .bar").setAttribute("aria-valuenow", pct);
  const out = [];
  for (const p of Object.keys(PHASES)) {
    const all = TASKS.filter(t => String(t.phase) === p);
    const d = all.filter(t => t.done).length;
    const shown = all.filter(t => filter === "all" || (filter === "done") === !!t.done);
    if (!shown.length) continue;
    out.push(`<section class="phase"><header><h2>${esc(PHASES[p])}</h2><span class="count">${d}/${all.length}</span></header>
      <div class="bar"><i style="width:${Math.round(d / all.length * 100)}%"></i></div><ul>` +
      shown.map(t => `<li class="${t.done ? "done" : ""}"><label>
        <input type="checkbox" ${t.done ? "checked" : ""} disabled>
        <span class="num">${esc(t.num)}</span>
        <span class="txt"><span>${esc(t.title)}</span>${t.note ? `<span class="note">${esc(t.note)}</span>` : ""}</span>
      </label></li>`).join("") + `</ul></section>`);
  }
  $("phases").innerHTML = out.join("");
}
document.querySelector(".filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
render();
</script>



</html>
